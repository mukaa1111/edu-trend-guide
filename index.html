<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리 아이 교육 수첩</title>
<meta name="description" content="둔산 초등 학부모 수첩: 이번 달 챙길 것, 초2부터 중3까지의 갈림길, 주제별 핵심 요약과 근거 자료">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  /* 공책: 흰 종이, 남색 잉크, 형광펜, 빨간펜, 파란 볼펜 */
  :root{
    --desk:#edf1f6; --paper:#ffffff; --ink:#17233b; --pencil:#5b6a82; --rule:#d3dce8;
    --marker:#ffe45c; --marker-ink:#17233b; --red:#d43d2a; --red-soft:#fbe7e3; --blue:#2c5bcc; --blue-soft:#e8eefb;
    --ok:#2f8f6b; --mid:#9aa6b8; --warn:#c9781a;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --desk:#0e1522; --paper:#172032; --ink:#e8edf5; --pencil:#95a3ba; --rule:#2a3650;
      --marker:#f0d24a; --marker-ink:#17233b; --red:#ff806c; --red-soft:#3a1d1a; --blue:#93b3ff; --blue-soft:#1d2a47;
      --ok:#6fcfa8; --mid:#6b7a93; --warn:#f0ad4e;
    }
  }
  :root[data-theme="dark"]{
    --desk:#0e1522; --paper:#172032; --ink:#e8edf5; --pencil:#95a3ba; --rule:#2a3650;
    --marker:#f0d24a; --marker-ink:#17233b; --red:#ff806c; --red-soft:#3a1d1a; --blue:#93b3ff; --blue-soft:#1d2a47;
    --ok:#6fcfa8; --mid:#6b7a93; --warn:#f0ad4e;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--desk);color:var(--ink);
    font:16px/1.6 "Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    word-break:keep-all;overflow-wrap:anywhere;font-feature-settings:"tnum"}
  button{font:inherit;color:inherit;cursor:pointer}
  :focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}
  .wrap{max-width:760px;margin:0 auto;padding:0 18px}

  /* 상단 고정 */
  .top{position:sticky;top:0;z-index:5;background:var(--desk);border-bottom:1px solid var(--rule)}
  .top .wrap{padding-top:12px}
  .brand{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .brand a{font-size:17px;font-weight:800;letter-spacing:-.02em;color:var(--ink);text-decoration:none}
  .brand span{font-size:12px;color:var(--pencil);white-space:nowrap}
  .search{position:relative;margin-top:9px}
  .search input{width:100%;padding:11px 40px 11px 14px;border:1.5px solid var(--rule);border-radius:8px;background:var(--paper);color:var(--ink);font:inherit;font-size:16px}
  .search input::placeholder{color:var(--mid)}
  .search input:focus{outline:0;border-color:var(--ink)}
  .search button{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--pencil);font-size:20px;padding:4px 10px;display:none}
  .tabs{display:flex;margin-top:4px}
  .tabs button{flex:1;background:none;border:0;padding:11px 4px 10px;font-size:15px;color:var(--pencil);border-bottom:3px solid transparent;font-weight:500}
  .tabs button.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:800}

  main.wrap{padding-top:28px;padding-bottom:80px}

  /* 홈: 지금 */
  .now{font-size:clamp(40px,11vw,64px);font-weight:900;letter-spacing:-.04em;line-height:1;margin:0}
  .now small{display:block;font-size:15px;font-weight:500;letter-spacing:0;color:var(--pencil);margin-top:10px}
  .h{font-size:20px;font-weight:800;letter-spacing:-.02em;margin:38px 0 4px}
  .hs{font-size:13.5px;color:var(--pencil);margin:0 0 12px}

  /* 이번 달: 빨간펜 날짜 + 한 줄 */
  .due{background:var(--paper);border-radius:8px;border:1px solid var(--rule);overflow:hidden}
  .due button{display:flex;gap:12px;align-items:baseline;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:12px 14px}
  .due button:first-child{border-top:0}
  .due button:hover{background:var(--blue-soft)}
  .due b{flex:none;width:52px;color:var(--red);font-weight:800;font-size:15px}
  .due span{font-size:15px;font-weight:600;line-height:1.4;min-width:0}
  .due span>u{text-decoration:none;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .due em{display:block;font-style:normal;font-weight:400;font-size:12.5px;color:var(--pencil);margin-top:1px}
  .linkbtn{background:none;border:0;padding:10px 2px 0;color:var(--blue);font-weight:700;font-size:14px}

  /* 갈림길 눈금자 */
  .ruler{position:relative;background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:6px 0}
  .ruler::before{content:"";position:absolute;left:70px;top:0;bottom:0;width:2px;background:var(--red);opacity:.45}
  .gr{display:grid;grid-template-columns:70px 1fr;border-top:1px solid var(--rule)}
  .gr:first-child{border-top:0}
  .gr.past{opacity:.45}
  .gl{padding:14px 0 0 14px;font-size:19px;font-weight:900;letter-spacing:-.03em}
  .gl i{display:inline-block;font-style:normal;font-size:11px;font-weight:800;background:var(--marker);color:var(--marker-ink);padding:1px 6px;border-radius:3px;margin-top:4px;letter-spacing:0}
  .ms{padding:6px 0}
  .ms button{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 14px 8px 18px;position:relative}
  .ms button:hover{background:var(--blue-soft)}
  .ms button::before{content:"";position:absolute;left:-5px;top:17px;width:10px;height:2px;background:var(--red);opacity:.6}
  .ms .w{font-size:12.5px;color:var(--pencil);font-weight:600;display:block}
  .ms .ti{font-size:15.5px;font-weight:700;line-height:1.4;display:block}
  .ms .de{font-size:13.5px;color:var(--pencil);display:block;line-height:1.5;margin-top:1px}
  .ms .big .ti{background:linear-gradient(transparent 55%,var(--marker) 55%);display:inline;color:var(--ink)}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .ms .big .ti{background:none;color:var(--marker)} }
  :root[data-theme="dark"] .ms .big .ti{background:none;color:var(--marker)}
  .ms .big::before{height:4px;top:16px;opacity:1}

  /* 찾아보기: 차례 */
  .toc{background:var(--paper);border:1px solid var(--rule);border-radius:8px;display:grid;grid-template-columns:1fr 1fr;overflow:hidden}
  @media (max-width:560px){.toc{grid-template-columns:1fr}}
  .toc button{display:flex;align-items:baseline;gap:8px;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:12px 14px}
  .toc button:hover{background:var(--blue-soft)}
  .toc b{font-size:15.5px;font-weight:700;white-space:nowrap}
  .toc span{flex:1;font-size:12.5px;color:var(--pencil);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:0}
  .toc i{font-style:normal;font-size:13px;color:var(--pencil);font-weight:600}
  @media (min-width:561px){.toc button:nth-child(odd){border-right:1px solid var(--rule)} .toc button:nth-child(-n+2){border-top:0}}
  @media (max-width:560px){.toc button:first-child{border-top:0}}

  /* 주제 화면 */
  .back{background:none;border:0;padding:0;color:var(--blue);font-weight:700;font-size:14px}
  .title{font-size:clamp(26px,7vw,34px);font-weight:900;letter-spacing:-.035em;line-height:1.15;margin:8px 0 0}
  .core{background:var(--paper);border:1px solid var(--rule);border-left:3px solid var(--red);border-radius:8px;padding:16px 16px 14px;margin-top:16px}
  .core h4{margin:0 0 8px;font-size:13.5px;font-weight:800;color:var(--pencil)}
  .core ul{margin:0;padding:0;list-style:none}
  .core li{position:relative;padding:7px 0 7px 18px;font-size:15.5px;line-height:1.55;border-top:1px dashed var(--rule)}
  .core li:first-child{border-top:0}
  .core li::before{content:"";position:absolute;left:0;top:15px;width:9px;height:9px;background:var(--marker);border-radius:2px}
  .core .watch{margin:10px 0 0;font-size:14px;color:var(--red);line-height:1.5}

  .bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:26px 0 8px}
  .bar h5{margin:0;font-size:16px;font-weight:800;flex:1;min-width:110px}
  .bar h5 small{font-weight:500;color:var(--pencil);font-size:13px}
  .pill{border:1.5px solid var(--rule);background:var(--paper);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--ink)}
  .pill.on{background:var(--ink);border-color:var(--ink);color:var(--paper);font-weight:700}
  .pill.x::after{content:" ×"}
  select.pill{appearance:none;-webkit-appearance:none;padding-right:26px;background-image:linear-gradient(45deg,transparent 50%,var(--pencil) 50%),linear-gradient(135deg,var(--pencil) 50%,transparent 50%);background-position:calc(100% - 14px) 55%,calc(100% - 9px) 55%;background-size:5px 5px;background-repeat:no-repeat}
  .panel{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:12px;margin-bottom:10px;display:none}
  .panel.open{display:block}
  .frow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
  .frow:last-child{margin-bottom:0}
  .frow span{font-size:12px;color:var(--pencil);width:38px;flex:none}
  .chip{border:1.5px solid var(--rule);background:var(--paper);padding:5px 11px;border-radius:999px;font-size:13.5px}
  .chip.on{background:var(--ink);border-color:var(--ink);color:var(--paper);font-weight:700}

  /* 자료 목록: 접힌 줄 */
  .sec{font-size:13.5px;font-weight:800;color:var(--pencil);margin:18px 0 6px}
  .sec small{font-weight:500}
  .list{background:var(--paper);border:1px solid var(--rule);border-radius:8px;overflow:hidden}
  details.it{border-top:1px solid var(--rule)}
  details.it:first-child{border-top:0}
  details.it>summary{list-style:none;cursor:pointer;padding:12px 46px 11px 14px;position:relative}
  details.it>summary::-webkit-details-marker{display:none}
  details.it>summary:hover,details.it[open]>summary{background:var(--blue-soft)}
  .t{font-size:15.5px;font-weight:650;line-height:1.42}
  .tt{font-size:13.5px;color:var(--pencil);line-height:1.45;margin-top:1px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
  details.it[open] .tt{display:block}
  .m{font-size:12.5px;color:var(--pencil);margin-top:3px;display:flex;flex-wrap:wrap;gap:2px 8px;align-items:center}
  .dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--mid);display:inline-block}
  .dot.hi{background:var(--ok)} .dot.lo{background:var(--warn)}
  .dd{color:var(--red);font-weight:800}
  .dd.past{color:var(--mid);font-weight:500}
  .fav{position:absolute;right:4px;top:6px;border:0;background:none;font-size:21px;line-height:1;padding:8px 10px;color:var(--mid)}
  .s-todo .fav{color:#e0a800} .s-done .fav{color:var(--ok);font-weight:800} .s-skip .fav{color:var(--mid)}
  details.s-skip>summary .t, details.s-done>summary .t{color:var(--pencil);font-weight:500}
  details.s-done>summary .t{text-decoration:line-through;text-decoration-color:var(--mid)}
  .stb{display:flex;gap:6px;padding-top:10px}
  .stb button{flex:1;border:1.5px solid var(--rule);background:var(--paper);border-radius:8px;padding:8px 4px;font-size:13.5px;font-weight:600}
  .stb button.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
  .body{padding:0 14px 14px;font-size:15px}
  .body p{margin:9px 0 0}
  .body .note{color:var(--pencil);font-size:13.5px;border-left:3px solid var(--rule);padding-left:10px}
  .foot{margin-top:11px;font-size:12.5px;color:var(--pencil);display:flex;flex-wrap:wrap;gap:3px 12px}
  .foot a{color:var(--blue);font-weight:700}
  .lo-txt{color:var(--warn);font-weight:700}
  .more{display:block;width:100%;margin-top:10px;padding:12px;border:1.5px solid var(--rule);background:var(--paper);border-radius:8px;font-size:14px;font-weight:700}
  .empty{color:var(--pencil);text-align:center;padding:44px 0}
  .legend{font-size:12.5px;color:var(--pencil);display:flex;gap:6px 14px;flex-wrap:wrap;margin:12px 2px 0}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .grades{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 4px}
  footer.wrap{font-size:12.5px;color:var(--pencil);padding-bottom:34px;line-height:1.6}
</style>
</head>
<body>
<div class="top"><div class="wrap">
  <div class="brand"><a href="#/">우리 아이 교육 수첩</a><span id="updated"></span></div>
  <div class="search">
    <input id="q" type="search" placeholder="찾기: 황소, 웩슬러, 지역인재, 경시대회" autocomplete="off" aria-label="찾기">
    <button id="qx" aria-label="검색어 지우기">×</button>
  </div>
  <div class="tabs">
    <button data-view="home">한눈에</button>
    <button data-view="grade">학년별</button>
    <button data-view="fav">우리 집 <span id="favn"></span></button>
  </div>
</div></div>

<main class="wrap"><div id="out"></div></main>
<footer class="wrap">수집한 시점 기준이라 틀리거나 바뀐 내용이 있을 수 있어요. 주황 점은 공식 자료로 확인하지 못한 내용이에요. 고치거나 더할 것은 Claude에게 말하면 돼요.</footer>

<script>
// 자료 파일은 하루에 한 번은 새로 받게 함 (자동 갱신이 반영되도록)

</script>
<script>
(function(){
  var ITEMS = window.ITEMS || [], GUIDES = window.GUIDES || {}, MILESTONES = window.MILESTONES || [];
  var $ = function(id){ return document.getElementById(id); };
  var out = $('out');
  $('updated').textContent = (window.LAST_UPDATED||'') + ' 갱신';

  // ── 도우미 ──
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  var NOW = new Date(), TODAY = new Date(); TODAY.setHours(0,0,0,0);
  function dday(it){ if (!it.deadline) return null; var p=it.deadline.split('-');
    return Math.round((new Date(+p[0],+p[1]-1,+p[2]) - TODAY)/86400000); }
  function idIs(it, re){ return re.test(it.id); }
  var ALL_GRADES = ['초1','초2','초3','초4','초5','초6','중1','중2','중3'];
  var base = window.CHILD_BASE || {year:2026, grade:'초2'};
  var gi = ALL_GRADES.indexOf(base.grade) + (NOW.getFullYear()-base.year) - (NOW.getMonth()<2 ? 1 : 0);
  gi = Math.max(0, Math.min(ALL_GRADES.length-1, gi));
  var CHILD = ALL_GRADES[gi];
  var TRUST_RANK = {'높음':0,'보통':1,'확인 필요':2};
  var TYPE_ORDER = ['로드맵','트렌드','학원','학습지','대회','경험'];
  var TYPE_LABEL = {'로드맵':'알아둘 흐름과 제도','트렌드':'요즘 흐름','학원':'학원과 설명회','학습지':'교재와 앱','대회':'대회와 시험','경험':'체험과 활동'};

  // ── 주제 ──
  var TOPICS = [
    {k:'due',   name:'이번 달 챙길 것', desc:'30일 안의 마감·설명회·개강',
      f:function(it){ var d=dday(it); return d!==null && d>=0 && d<=30; }},
    {k:'dunsan',name:'둔산 학원', desc:'레벨테스트, 설명회, 개강',
      f:function(it){ return it.region==='둔산' && it.type==='학원'; }},
    {k:'math',  name:'수학 공부 순서', desc:'교재 단계, 선행 속도',
      f:function(it){ return it.subject==='수학' && (it.type==='로드맵'||it.type==='학습지'||it.type==='트렌드'); }},
    {k:'mathc', name:'수학 대회', desc:'HME, KMA, KMC, 성대경시',

    {k:'eng',   name:'영어 공부 순서', desc:'원서, 파닉스, 문법 시기',
      f:function(it){ return it.subject==='영어' && it.type!=='대회' && !idIs(it,/vocab/) && it.region!=='잠실'; }},
    {k:'vocab', name:'영어 어휘', desc:'읽기량, 교재, 하루 개수',
      f:function(it){ return idIs(it,/-vocab-/); }},
    {k:'engc',  name:'영어 시험과 대회', desc:'TOSEL, 토플주니어, 말하기',
      f:function(it){ return it.subject==='영어' && it.type==='대회'; }},
    {k:'gifted',name:'영재원과 KAIST', desc:'초4 11월이 첫 관문',
      f:function(it){ return idIs(it,/gifted|-kaist-|-ged-|yeongjae|youngjae/) && !idIs(it,/regional|kwagiwon|daesin|daeseong|gwacheon/); }},
    {k:'wisc',  name:'웩슬러 검사', desc:'받는 곳, 비용, 쓰임새',
      f:function(it){ return idIs(it,/-wisc-/); }},
    {k:'regional',name:'지역인재', desc:'자격 요건, 충청권 의대',
      f:function(it){ return idIs(it,/-regional-|compare-daejeon-gwacheon-regional/); }},
    {k:'jasago',name:'대전 자사고와 과기원', desc:'대신고, 대성고, UNIST·GIST',
      f:function(it){ return idIs(it,/-daesin-|-daeseong-|-kwagiwon-/) || idIs(it,/trend-dunsan-(autonomous|dongsin|daejeon-science|gifted-school)/); }},
    {k:'sci',   name:'과학과 코딩 활동', desc:'과학관, 주니어닥터, 발명',
      f:function(it){ return it.subject==='과학' && (it.type==='경험'||it.type==='대회'); }},
    {k:'video', name:'볼거리 영상', desc:'믿을 만한 과학·역사 채널',
      f:function(it){ return idIs(it,/-video/); }},
    {k:'etc',   name:'독서·역사·예체능', desc:'공모전, 한국사, 미술, 체육',
      f:function(it){ return (it.subject==='국어'||it.subject==='사회'||it.subject==='예체능'||idIs(it,/-etc-|record-rules|roadmap-by-grade/)) && it.type!=='트렌드'; }},
    {k:'tdj',   name:'대전·둔산은 지금', desc:'학군, 진학, 제도 변화',
      f:function(it){ return it.region==='둔산' && it.type==='트렌드'; }},
    {k:'ttop',  name:'잘하는 아이들은', desc:'대치·목동 흐름, 입시 변화',
      f:function(it){ return it.type==='트렌드' && (it.region==='대치'||it.region==='목동'||it.region==='공통'); }},
    {k:'gc',    name:'대전과 과천 비교', desc:'지역인재, 진학, 학원가',
      f:function(it){ return it.region==='과천' || idIs(it,/-compare-/); }},
    {k:'js',    name:'잠실 참고', desc:'학원가, 과밀, 구청 프로그램',
      f:function(it){ return it.region==='잠실'; }},
    {k:'all',   name:'모든 자료', desc:'전체를 한 목록으로',
      f:function(){ return true; }}
  ];
  var TOPIC_BY_KEY = {}; TOPICS.forEach(function(t){ TOPIC_BY_KEY[t.k]=t; });

  // ── 상태 ──
  var OPTS = { region:['둔산','대치','목동','과천','잠실','공통'], grade:['초2','초3','초4','초5','초6','중1','중2','중3'],
    subject:['수학','영어','국어','과학','사회','예체능','공통'], type:TYPE_ORDER, trust:['높음','보통','확인 필요'] };
  var FLABEL = {region:'지역', grade:'학년', subject:'과목', type:'종류', trust:'신뢰도'};
  var S = {view:'home', topic:null, q:'', f:{}, sort:'기본', limit:40, panel:false, grade:CHILD};
  // 우리 집 상태: 자료마다 'todo'(할 예정) | 'done'(했음) | 'skip'(관심 없음). 이 브라우저에만 저장.
  var st = {};
  try {
    st = JSON.parse(localStorage.getItem('edu.st')||'{}')||{};
    var old = JSON.parse(localStorage.getItem('edu.favs')||'{}')||{};   // 예전 '찜'은 할 예정으로 옮김
    Object.keys(old).forEach(function(k){ if (old[k] && !st[k]) st[k]='todo'; });
    S.grade = localStorage.getItem('edu.grade')||CHILD;
  } catch(e){}
  function saveSt(){ try{ localStorage.setItem('edu.st', JSON.stringify(st)); }catch(e){} }
  function countSt(v){ return Object.keys(st).filter(function(k){ return st[k]===v; }).length; }
  var ST_MARK = {todo:'★', done:'✓', skip:'–'};
  var ST_LABEL = {todo:'할 예정', done:'했음', skip:'관심 없음'};
  var ITEM_BY_ID = {}; ITEMS.forEach(function(it){ ITEM_BY_ID[it.id]=it; });

  function readHash(){
    var h = (location.hash||'').replace(/^#\/?/, '');
    S.topic = null;
    if (h.indexOf('t/')===0 && TOPIC_BY_KEY[h.slice(2)]) { S.view='home'; S.topic=h.slice(2); }
    else if (h==='grade') S.view='grade';
    else if (h==='fav') S.view='fav';
    else S.view='home';
    S.f = {}; S.sort='기본'; S.limit=40; S.panel=false;
  }
  function go(hash){ if (location.hash===hash) { readHash(); render(); } else location.hash = hash; }
  window.addEventListener('hashchange', function(){ S.q=''; $('q').value=''; readHash(); render(); window.scrollTo(0,0); });

  // ── 자료 한 줄 ──
  function ddText(d){ return d<0 ? '마감 지남' : d===0 ? '오늘' : 'D-'+d; }
  function ageDays(it){ if (!it.collected) return 0; var p=it.collected.split('-');
    return Math.round((TODAY - new Date(+p[0],+p[1]-1,+p[2]))/86400000); }
  var pendingOpen = null, rulerOpen = false;   // 눌러서 들어온 항목을 펼쳐 보여주기 / 갈림길 전체 펼침
  function row(it){
    var d = dday(it);
    var dd = d===null ? '' : '<span class="dd'+(d<0?' past':'')+'">'+ddText(d)+'</span>';
    var tcls = it.trust==='높음'?'hi':(it.trust==='확인 필요'?'lo':'');
    var src = it.url ? '<a href="'+esc(it.url)+'" target="_blank" rel="noopener">출처 열기</a><span>'+esc(it.source||'')+'</span>' : '<span>출처 '+esc(it.source||'없음')+'</span>';
    var trust = it.trust==='확인 필요' ? '<span class="lo-txt">확인 필요</span>' : '<span>신뢰도 '+esc(it.trust||'')+'</span>';
    var s = st[it.id] || '';
    var old = ageDays(it) > 180;   // 수집한 지 반년 넘으면 표시
    return '<details class="it'+(s?' s-'+s:'')+'" data-id="'+esc(it.id)+'"><summary>'
      + '<div class="t">'+esc(it.name || it.title)+'</div>'
      + (it.name ? '<div class="tt">'+esc(it.title)+'</div>' : '')
      + '<div class="m"><span class="dot '+tcls+'" title="신뢰도 '+esc(it.trust)+'"></span>'
      + dd + '<span>'+esc(it.region)+'</span>' + (it.timing && !it.name?'<span>'+esc(it.timing)+'</span>':'')
      + (old?'<span class="lo-txt">오래된 자료</span>':'') + '</div>'
      + '<button class="fav" data-fav aria-label="할 예정에 담기">'+(ST_MARK[s]||'☆')+'</button>'
      + '</summary><div class="body">'
      + '<div class="stb">'+['todo','done','skip'].map(function(v){
          return '<button data-st="'+v+'"'+(s===v?' class="on"':'')+'>'+ST_LABEL[v]+'</button>'; }).join('')+'</div>'
      + '<p>'+esc(it.summary)+'</p>'
      + (it.note?'<p class="note">'+esc(it.note)+'</p>':'')
      + '<div class="foot"><span>'+esc((it.grades||[]).join(' '))+'</span><span>'+esc(it.subject)+'</span>'
      + (it.deadline?'<span>마감 '+esc(it.deadline)+'</span>':'')
      + (it.timing && it.name?'<span>'+esc(it.timing)+'</span>':'')
      + src + '<span>'+esc(it.collected||'')+' 수집'+(old?' (반년 넘음, 다시 확인 필요)':'')+'</span>'+trust+'</div>'
      + '</div></details>';
  }
  function byDefault(a,b){
    var da=dday(a), db=dday(b);
    var ua = da!==null&&da>=0 ? da : 9999, ub = db!==null&&db>=0 ? db : 9999;
    if (ua!==ub) return ua-ub;
    var t = TRUST_RANK[a.trust]-TRUST_RANK[b.trust];
    return t || a.title.localeCompare(b.title,'ko');
  }
  function listBox(items){ return '<div class="list">'+items.map(row).join('')+'</div>'; }
  function grouped(items){
    var html='';
    TYPE_ORDER.forEach(function(tp){
      var g = items.filter(function(x){ return x.type===tp; });
      if (g.length) html += '<div class="sec">'+esc(TYPE_LABEL[tp])+' <small>'+g.length+'</small></div>'+listBox(g);
    });
    return html;
  }
  var LEGEND = '<div class="legend"><span><i class="dot hi"></i>공식 자료</span><span><i class="dot"></i>언론, 여러 출처</span><span><i class="dot lo"></i>확인 필요</span><span>☆ 누르면 할 예정에 담겨요</span></div>';

  // 상태를 바꾸고, 열려 있는 그 줄만 바로 고쳐 그림 (목록을 다시 그리면 펼친 게 닫히므로)
  function setSt(el, v){
    var box = el.closest('details.it'); if (!box) return;
    var id = box.dataset.id;
    if (!v || st[id]===v) delete st[id]; else st[id]=v;
    saveSt();
    var s = st[id] || '';
    box.className = 'it' + (s?' s-'+s:'');
    box.querySelector('.fav').textContent = ST_MARK[s] || '☆';
    box.querySelectorAll('.stb button').forEach(function(b){ b.classList.toggle('on', b.dataset.st===s); });
    paintCount();
  }
  function paintCount(){ var n = countSt('todo'); $('favn').textContent = n ? n : ''; }

  // ── 우리 집 ──
  function mine(){
    var html = '<h2 class="title">우리 집</h2><p class="hs" style="margin-top:8px">자료를 펼쳐 할 예정, 했음, 관심 없음을 누르면 여기에 모여요. 이 기기에만 저장돼요.</p>';
    var any = false;
    ['todo','done','skip'].forEach(function(v){
      var g = Object.keys(st).filter(function(k){ return st[k]===v && ITEM_BY_ID[k]; }).map(function(k){ return ITEM_BY_ID[k]; }).sort(byDefault);
      if (!g.length) return; any = true;
      html += '<div class="sec">'+ST_LABEL[v]+' <small>'+g.length+'</small></div>'+listBox(g);
    });
    if (!any) html += '<div class="empty">아직 표시한 게 없어요. 자료 오른쪽의 ☆를 누르면 할 예정에 담겨요.</div>';
    html += '<p class="hs" style="margin-top:22px">폰과 PC에서 같은 목록을 보려면 <button class="linkbtn" style="padding:0" data-export>내보내기</button> 로 받은 글자를 다른 기기에서 <button class="linkbtn" style="padding:0" data-import>가져오기</button> 에 붙여넣으세요.</p>';
    out.innerHTML = html;
  }

  // ── 한눈에 (홈) ──
  function home(){
    var month = NOW.getMonth()+1;
    var html = '<p class="now">'+CHILD+', '+month+'월<small>지금 챙길 것과 앞으로 올 갈림길을 먼저 보여드려요.</small></p>';

    var todo = Object.keys(st).filter(function(k){ return st[k]==='todo' && ITEM_BY_ID[k]; }).map(function(k){ return ITEM_BY_ID[k]; }).sort(byDefault);
    if (todo.length){
      html += '<h2 class="h">우리 집 할 예정</h2><p class="hs">직접 담아둔 것 '+todo.length+'건, 마감이 가까운 순서</p><div class="due">';
      todo.slice(0,5).forEach(function(it){ var d=dday(it);
        html += '<button data-mine data-open="'+esc(it.id)+'"><b'+(d===null||d<0?' style="color:var(--mid)"':'')+'>'+(d===null?'상시':ddText(d))+'</b><span><u>'+esc(it.name||it.title)+'</u><em>'+esc(it.region)+(it.timing?', '+esc(it.timing):'')+'</em></span></button>'; });
      html += '</div>';
      if (todo.length>5) html += '<button class="linkbtn" data-mine>'+todo.length+'건 모두 보기</button>';
    }

    var due = ITEMS.filter(TOPIC_BY_KEY.due.f).filter(function(it){ return st[it.id]!=='skip' && st[it.id]!=='done'; }).sort(byDefault);
    html += '<h2 class="h">이번 달 챙길 것</h2>';
    if (!due.length) html += '<p class="hs">30일 안에 마감되는 게 없어요.</p>';
    else {
      html += '<p class="hs">30일 안에 마감되거나 열리는 것 '+due.length+'건</p><div class="due">';
      due.slice(0,5).forEach(function(it){ var d=dday(it);
        html += '<button data-topic="due" data-open="'+esc(it.id)+'"><b>'+ddText(d)+'</b><span><u>'+esc(it.name||it.title)+'</u><em>'+esc(it.region)+(it.timing?', '+esc(it.timing):'')+'</em></span></button>'; });
      html += '</div>';
      if (due.length>5) html += '<button class="linkbtn" data-topic="due">'+due.length+'건 모두 보기</button>';
    }

    html += '<h2 class="h">궁금한 것 찾기</h2><p class="hs">주제마다 핵심 요약이 먼저 나오고, 근거 자료는 그 아래에 있어요.</p><div class="toc">';
    TOPICS.forEach(function(t){ if (t.k==='due') return;
      html += '<button data-topic="'+t.k+'"><b>'+esc(t.name)+'</b><span>'+esc(t.desc)+'</span></button>'; });
    html += '</div>';

    var later = 0;
    html += '<h2 class="h">앞으로의 갈림길</h2><p class="hs">형광펜은 놓치면 되돌리기 어려운 결정이에요. 누르면 자세한 내용이 열려요.</p><div class="ruler">';
    ALL_GRADES.forEach(function(g, i){
      var ms = MILESTONES.filter(function(m){ return m.grade===g; });
      if (!ms.length) return;
      if (!rulerOpen && i > gi+1) { later += ms.length; return; }   // 처음엔 지금 학년과 다음 학년만
      html += '<div class="gr'+(i<gi?' past':'')+'"><div class="gl">'+g+(i===gi?'<br><i>지금</i>':'')+'</div><div class="ms">'
        + ms.map(function(m){ return '<button'+(m.big?' class="big"':'')+' data-topic="'+esc(m.topic)+'"><span class="w">'+esc(m.when)+'</span>'
            + '<span class="ti">'+esc(m.title)+'</span><span class="de">'+esc(m.desc)+'</span></button>'; }).join('')
        + '</div></div>';
    });
    html += '</div>';
    if (later) html += '<button class="more" data-ruler>'+ALL_GRADES[Math.min(gi+2, ALL_GRADES.length-1)]+'부터 중3까지 '+later+'개 더 보기</button>';
    out.innerHTML = html;
  }

  // ── 주제 / 검색 / 찜 ──
  function results(){
    var isSearch = !!S.q, topic = S.topic && TOPIC_BY_KEY[S.topic];
    var base0 = S.view==='fav' ? ITEMS.filter(function(x){ return st[x.id]; }) : topic ? ITEMS.filter(topic.f) : ITEMS.slice();
    if (isSearch){
      var words = S.q.toLowerCase().split(/\s+/).filter(Boolean);
      base0 = (S.view==='fav'?base0:ITEMS).filter(function(it){
        var hay = [it.title,it.summary,it.note,it.timing,it.source,(it.grades||[]).join(' '),it.region,it.subject,it.type].join(' ').toLowerCase();
        return words.every(function(w){ return hay.indexOf(w)>=0; });
      });
    }
    var items = base0.filter(function(it){
      if (S.f.region && it.region!==S.f.region) return false;
      if (S.f.grade && (it.grades||[]).indexOf(S.f.grade)<0) return false;
      if (S.f.subject && it.subject!==S.f.subject) return false;
      if (S.f.type && it.type!==S.f.type) return false;
      if (S.f.trust && it.trust!==S.f.trust) return false;
      return true;
    });
    if (S.sort==='마감순') items.sort(function(a,b){ var x=dday(a),y=dday(b); x=(x===null||x<0)?9999:x; y=(y===null||y<0)?9999:y; return x-y || byDefault(a,b); });
    else if (S.sort==='신뢰도순') items.sort(function(a,b){ return TRUST_RANK[a.trust]-TRUST_RANK[b.trust] || byDefault(a,b); });
    else items.sort(byDefault);

    var title = isSearch ? '“'+S.q+'” 찾은 결과' : S.view==='fav' ? '우리 집' : topic.name;
    var html = (S.view==='fav' && !isSearch ? '' : '<button class="back" data-home>‹ 한눈에 보기로</button>')
      + '<h2 class="title">'+esc(title)+'</h2>';

    var g = (!isSearch && topic) ? GUIDES[topic.k] : null;
    if (g){
      html += '<div class="core"><h4>핵심만</h4><ul>'+g.points.map(function(p){ return '<li>'+esc(p)+'</li>'; }).join('')+'</ul>'
        + (g.watch?'<p class="watch">조심할 점: '+esc(g.watch)+'</p>':'')+'</div>';
    }

    var active = Object.keys(S.f).filter(function(k){ return S.f[k]; });
    html += '<div class="bar"><h5>'+(g?'근거 자료 ':'')+'<small>'+items.length+'건</small></h5>'
      + active.map(function(k){ return '<button class="pill on x" data-clear="'+k+'">'+esc(S.f[k])+'</button>'; }).join('')
      + '<button class="pill'+(S.panel?' on':'')+'" data-panel>골라 보기</button>'
      + '<select class="pill" id="sort" aria-label="정렬">'
      + ['기본','마감순','신뢰도순'].map(function(s){ return '<option'+(S.sort===s?' selected':'')+'>'+s+'</option>'; }).join('') + '</select></div>';
    html += '<div class="panel'+(S.panel?' open':'')+'">';
    Object.keys(OPTS).forEach(function(k){
      var have = {}; base0.forEach(function(it){ if(k==='grade') (it.grades||[]).forEach(function(x){have[x]=1;}); else have[it[k]]=1; });
      var chips = OPTS[k].filter(function(v){ return have[v]; });
      if (chips.length<2) return;
      html += '<div class="frow"><span>'+FLABEL[k]+'</span>'+chips.map(function(v){
        return '<button class="chip'+(S.f[k]===v?' on':'')+'" data-f="'+k+'" data-v="'+esc(v)+'">'+esc(v)+'</button>'; }).join('')+'</div>';
    });
    html += '</div>';

    if (!items.length){
      html += '<div class="empty">맞는 자료가 없어요. 고른 조건을 줄이거나 다른 단어로 찾아보세요.</div>';
    } else if (S.sort==='기본' && !isSearch && S.topic!=='all' && S.topic!=='due' && items.length>8){
      html += grouped(items) + LEGEND;
    } else {
      html += listBox(items.slice(0,S.limit));
      if (items.length>S.limit) html += '<button class="more" data-more>'+(items.length-S.limit)+'건 더 보기</button>';
      html += LEGEND;
    }
    out.innerHTML = html;
  }

  // ── 학년별 ──
  var SEASONS = ['봄학기','여름방학','가을학기','겨울방학'];
  var SEASON_HINT = {'봄학기':'3~6월','여름방학':'7~8월','가을학기':'9~11월','겨울방학':'12~2월'};
  function gradeView(){
    var html = '<h2 class="title">'+S.grade+'에 할 수 있는 것</h2><div class="grades">'
      + OPTS.grade.map(function(g){ return '<button class="chip'+(S.grade===g?' on':'')+'" data-grade="'+g+'">'+g+'</button>'; }).join('') + '</div>';
    var ms = MILESTONES.filter(function(m){ return m.grade===S.grade; });
    if (ms.length){
      html += '<div class="core"><h4>이 학년의 갈림길</h4><ul>'+ms.map(function(m){
        return '<li><b>'+esc(m.when)+'</b> '+esc(m.title)+'. '+esc(m.desc)+'</li>'; }).join('')+'</ul></div>';
    }
    var pool = ITEMS.filter(function(it){
      return (it.grades||[]).indexOf(S.grade)>=0 && it.region!=='과천' && it.region!=='잠실' && it.type!=='트렌드'; });
    var any = false;
    SEASONS.forEach(function(s){
      var g = pool.filter(function(it){ return it.season===s; }).sort(byDefault);
      if (!g.length) return; any = true;
      html += '<div class="sec">'+s+' <small>'+SEASON_HINT[s]+', '+g.length+'건</small></div>'+listBox(g);
    });
    var yr = pool.filter(function(it){ return it.season==='연중'; }).sort(byDefault);
    if (yr.length){ any = true; html += '<div class="sec">시기와 상관없이 <small>'+yr.length+'건</small></div>' + grouped(yr); }
    if (!any) html += '<div class="empty">이 학년에 해당하는 자료가 아직 없어요.</div>';
    out.innerHTML = html + LEGEND;
  }

  function render(){
    document.querySelectorAll('.tabs button').forEach(function(b){ b.classList.toggle('on', b.dataset.view===S.view); });
    paintCount();
    $('qx').style.display = S.q ? 'block' : 'none';
    if (S.view==='fav' && !S.q) mine();
    else if (S.q || S.topic) results();
    else if (S.view==='grade') gradeView();
    else home();
    if (pendingOpen){   // 눌러서 들어온 그 항목을 펼친 채로 보여줌
      var box = out.querySelector('details.it[data-id="'+pendingOpen.replace(/"/g,'')+'"]'); pendingOpen = null;
      if (box){ box.open = true; setTimeout(function(){ box.scrollIntoView({block:'center'}); }, 30); }
    }
  }

  // ── 입력 ──
  document.querySelector('.tabs').addEventListener('click', function(e){
    var b = e.target.closest('button'); if (!b) return;
    S.q=''; $('q').value=''; go(b.dataset.view==='home' ? '#/' : '#/'+b.dataset.view);
  });
  var qt;
  $('q').addEventListener('input', function(e){ clearTimeout(qt); var v = e.target.value.trim();
    qt = setTimeout(function(){ S.q=v; S.limit=40; render(); }, 120); });
  $('qx').addEventListener('click', function(){ S.q=''; $('q').value=''; render(); $('q').focus(); });

  out.addEventListener('click', function(e){
    var el;
    if ((el = e.target.closest('[data-fav]'))){ e.preventDefault();
      var cur = st[el.closest('details.it').dataset.id]; setSt(el, cur ? null : 'todo'); return; }
    if ((el = e.target.closest('[data-st]'))){ setSt(el, el.dataset.st); return; }
    if ((el = e.target.closest('[data-mine]'))){ pendingOpen = el.dataset.open||null; go('#/fav'); return; }
    if (e.target.closest('[data-ruler]')){ rulerOpen = true; render(); return; }
    if (e.target.closest('[data-export]')){ window.prompt('아래 글자를 모두 복사해서 다른 기기의 가져오기에 붙여넣으세요.', JSON.stringify(st)); return; }
    if (e.target.closest('[data-import]')){
      var txt = window.prompt('다른 기기에서 내보낸 글자를 붙여넣으세요. 지금 목록에 합쳐져요.'); if (!txt) return;
      try { var o = JSON.parse(txt); Object.keys(o).forEach(function(k){ if (ST_LABEL[o[k]]) st[k]=o[k]; }); saveSt(); render(); }
      catch(err){ window.alert('글자를 읽지 못했어요. 내보내기에서 받은 글자를 처음부터 끝까지 붙여넣었는지 확인하세요.'); }
      return; }
    if ((el = e.target.closest('[data-topic]'))){ pendingOpen = el.dataset.open||null; go('#/t/'+el.dataset.topic); return; }
    if (e.target.closest('[data-home]')){ S.q=''; $('q').value=''; go('#/'); return; }
    if (e.target.closest('[data-panel]')){ S.panel=!S.panel; render(); return; }
    if ((el = e.target.closest('[data-clear]'))){ delete S.f[el.dataset.clear]; render(); return; }
    if ((el = e.target.closest('[data-f]'))){ var k=el.dataset.f, v=el.dataset.v;
      if (S.f[k]===v) delete S.f[k]; else S.f[k]=v; S.limit=40; render(); return; }
    if (e.target.closest('[data-more]')){ S.limit+=40; render(); return; }
    if ((el = e.target.closest('[data-grade]'))){ S.grade=el.dataset.grade;
      try{ localStorage.setItem('edu.grade', S.grade); }catch(err){} render(); return; }
  });
  out.addEventListener('change', function(e){ if (e.target.id==='sort'){ S.sort=e.target.value; render(); } });

  readHash(); render();
})();
</script>
</body>
</html>
