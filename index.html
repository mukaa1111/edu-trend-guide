<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리 아이 교육 정보</title>
<meta name="description" content="둔산·대치·목동 초등 교육 트렌드, 대회, 학원, 학습지, 경험활동 정보를 학년·과목·종류별로 모아둔 가족용 페이지">
<style>
  :root{
    --bg:#f6f4ef; --card:#ffffff; --ink:#1f2328; --muted:#6b7280; --line:#e5e1d8;
    --accent:#2f6f5e; --accent-ink:#ffffff; --chip:#eceae3; --chip-on:#2f6f5e;
    --warn:#b45309; --warn-bg:#fff4e5;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#15171a; --card:#1f2327; --ink:#e8e6e1; --muted:#9aa3ad; --line:#2d3237;
      --accent:#6fb59f; --accent-ink:#0f1512; --chip:#2a2f34; --chip-on:#6fb59f;
      --warn:#f5b041; --warn-bg:#3a2a12;
    }
  }
  :root[data-theme="dark"]{
    --bg:#15171a; --card:#1f2327; --ink:#e8e6e1; --muted:#9aa3ad; --line:#2d3237;
    --accent:#6fb59f; --accent-ink:#0f1512; --chip:#2a2f34; --chip-on:#6fb59f;
    --warn:#f5b041; --warn-bg:#3a2a12;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
  header{padding:20px 16px 8px;max-width:860px;margin:0 auto}
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:13px;margin:0}
  main{max-width:860px;margin:0 auto;padding:0 16px 60px}
  .tabs{display:flex;gap:6px;margin:14px 0 10px;border-bottom:1px solid var(--line)}
  .tabs button{background:none;border:0;padding:8px 12px;font-size:15px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
  .tabs button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
  .search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-size:15px;margin:6px 0 10px}
  .filters{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
  .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .row .lab{font-size:12px;color:var(--muted);width:34px;flex:none}
  .chip{border:0;background:var(--chip);color:var(--ink);padding:5px 11px;border-radius:999px;font-size:13px;cursor:pointer}
  .chip.on{background:var(--chip-on);color:var(--accent-ink);font-weight:600}
  .count{font-size:13px;color:var(--muted);margin:4px 0 10px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 14px 12px;margin-bottom:10px}
  .card h3{margin:0 0 6px;font-size:16px;line-height:1.35}
  .card p{margin:0 0 8px;font-size:14px}
  .tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
  .tag{font-size:12px;background:var(--chip);padding:2px 8px;border-radius:6px;color:var(--ink)}
  .tag.region{background:var(--accent);color:var(--accent-ink)}
  .meta{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
  .meta a{color:var(--accent)}
  .trust-low{color:var(--warn);background:var(--warn-bg);padding:1px 6px;border-radius:4px}
  .note{font-size:13px;color:var(--muted);margin-top:6px}
  .group{margin:18px 0 8px;font-size:15px;font-weight:700;border-left:4px solid var(--accent);padding-left:8px}
  .empty{color:var(--muted);text-align:center;padding:40px 0}
  footer{max-width:860px;margin:0 auto;padding:0 16px 30px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<header>
  <h1>우리 아이 교육 정보</h1>
  <p class="sub">둔산 중심 · 대치/목동/과천/잠실 참고 · 초2~초6 · 마지막 갱신 <span id="updated"></span></p>
</header>
<main>
  <div class="tabs">
    <button class="on" data-tab="list">찾아보기</button>
    <button data-tab="roadmap">시기별 로드맵</button>
  </div>
  <input class="search" id="q" type="search" placeholder="검색: 경시대회, 원서, 레벨테스트 …">
  <div class="filters">
    <div class="row" data-key="region"><span class="lab">지역</span></div>
    <div class="row" data-key="grade"><span class="lab">학년</span></div>
    <div class="row" data-key="subject"><span class="lab">과목</span></div>
    <div class="row" data-key="type"><span class="lab">종류</span></div>
  </div>
  <div class="count" id="count"></div>
  <div id="out"></div>
</main>
<footer>정보는 수집 시점 기준이며 틀릴 수 있어요. "확인 필요" 표시는 공식 자료로 확인하지 못한 내용입니다. 추가·수정은 Claude에게 "이 내용 추가해줘"라고 말하면 돼요.</footer>

<script src="data/items.js"></script>
<script>
(function(){
  var ITEMS = window.ITEMS || [];
  document.getElementById('updated').textContent = window.LAST_UPDATED || '';

  var OPTS = {
    region:  ['둔산','대치','목동','과천','잠실','공통'],
    grade:   ['초2','초3','초4','초5','초6','중1','중2','중3'],
    subject: ['수학','영어','국어','과학','사회','예체능','공통'],
    type:    ['대회','학원','학습지','경험','로드맵','트렌드']
  };
  var state = {tab:'list', q:'', region:null, grade:null, subject:null, type:null};
  try { state.tab = localStorage.getItem('edu.tab') || 'list'; } catch(e){}

  // 필터 버튼 만들기
  Object.keys(OPTS).forEach(function(key){
    var row = document.querySelector('.row[data-key="'+key+'"]');
    OPTS[key].forEach(function(v){
      var b = document.createElement('button');
      b.className='chip'; b.textContent=v; b.dataset.v=v;
      b.onclick=function(){ state[key] = (state[key]===v) ? null : v; render(); };
      row.appendChild(b);
    });
  });
  document.querySelectorAll('.tabs button').forEach(function(b){
    b.onclick=function(){ state.tab=b.dataset.tab; try{localStorage.setItem('edu.tab',state.tab);}catch(e){} render(); };
  });
  document.getElementById('q').addEventListener('input', function(e){ state.q=e.target.value.trim().toLowerCase(); render(); });

  function matches(it){
    if (state.region && it.region!==state.region) return false;
    if (state.grade && (it.grades||[]).indexOf(state.grade)<0) return false;
    if (state.subject && it.subject!==state.subject) return false;
    if (state.type && it.type!==state.type) return false;
    if (state.q){
      var hay = [it.title,it.summary,it.note,it.timing,it.source,(it.grades||[]).join(' '),it.region,it.subject,it.type].join(' ').toLowerCase();
      if (hay.indexOf(state.q)<0) return false;
    }
    return true;
  }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function card(it){
    var trust = it.trust==='확인 필요' ? '<span class="trust-low">확인 필요</span>' : '신뢰도 '+esc(it.trust||'-');
    var src = it.url ? '<a href="'+esc(it.url)+'" target="_blank" rel="noopener">'+esc(it.source||'출처')+'</a>' : esc(it.source||'');
    return '<div class="card">'
      + '<div class="tags"><span class="tag region">'+esc(it.region)+'</span>'
      + '<span class="tag">'+esc((it.grades||[]).join('·'))+'</span>'
      + '<span class="tag">'+esc(it.subject)+'</span><span class="tag">'+esc(it.type)+'</span>'
      + (it.timing?'<span class="tag">'+esc(it.timing)+'</span>':'')
      + (it.deadline?'<span class="tag">마감 '+esc(it.deadline)+'</span>':'') + '</div>'
      + '<h3>'+esc(it.title)+'</h3><p>'+esc(it.summary)+'</p>'
      + (it.note?'<div class="note">'+esc(it.note)+'</div>':'')
      + '<div class="meta"><span>'+src+'</span><span>수집 '+esc(it.collected||'')+'</span><span>'+trust+'</span></div>'
      + '</div>';
  }

  var GRADE_ORDER = OPTS.grade.concat(['초1']);
  var SEASON_ORDER = ['봄학기','여름방학','가을학기','겨울방학','연중'];
  function render(){
    document.querySelectorAll('.tabs button').forEach(function(b){ b.classList.toggle('on', b.dataset.tab===state.tab); });
    Object.keys(OPTS).forEach(function(key){
      document.querySelectorAll('.row[data-key="'+key+'"] .chip').forEach(function(b){ b.classList.toggle('on', state[key]===b.dataset.v); });
    });
    var list = ITEMS.filter(matches);
    var out = document.getElementById('out');
    document.getElementById('count').textContent = list.length+'건' + (list.length!==ITEMS.length?' / 전체 '+ITEMS.length+'건':'');
    if (!list.length){ out.innerHTML='<div class="empty">맞는 정보가 아직 없어요.</div>'; return; }

    if (state.tab==='list'){
      list.sort(function(a,b){ return (b.collected||'').localeCompare(a.collected||''); });
      out.innerHTML = list.map(card).join('');
      return;
    }
    // 로드맵: 학년 → 시기 순으로 묶어서 보기. 여러 학년에 걸친 항목은 각 학년에 모두 나옴.
    var groups = {};
    list.forEach(function(it){
      (it.grades||['기타']).forEach(function(g){
        var k = g+' · '+(it.season||'연중');
        (groups[k]=groups[k]||[]).push(it);
      });
    });
    var keys = Object.keys(groups).sort(function(a,b){
      var ga=a.split(' · ')[0], gb=b.split(' · ')[0], sa=a.split(' · ')[1], sb=b.split(' · ')[1];
      var d = GRADE_ORDER.indexOf(ga)-GRADE_ORDER.indexOf(gb);
      return d!==0 ? d : SEASON_ORDER.indexOf(sa)-SEASON_ORDER.indexOf(sb);
    });
    out.innerHTML = keys.map(function(k){ return '<div class="group">'+esc(k)+'</div>'+groups[k].map(card).join(''); }).join('');
  }
  render();
})();
</script>
</body>
</html>
